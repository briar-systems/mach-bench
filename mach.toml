[project]
id = "bench"
version = "0.2.0"
mach = "^5.9"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[artifact.mach-bench]
kind = "bin"
entry = "main.mach"
out = "bin/mach-bench"
targets = ["*"]
link = []
need = []

[profile.debug]
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
default = true
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

# release plus permission to reassociate float reductions; the mach side of a
# `cc -ffast-math` comparison, selected by bench.sh --fast-math
[profile.reassoc]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = true

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^6.0"
