[project]
id = "bench"
version = "0.3.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[artifact.mach-bench]
kind = "bin"
entry = "bin/main.mach"
out = "{project.work}/bin/mach-bench{artifact.suffix}"
targets = ["*"]
link = []
need = []

[profile.debug]
optimize = false
debug = true
simd = "scalarize"

[profile.release]
default = true
optimize = true
debug = false
simd = "scalarize"

# release plus permission to reassociate float reductions; the mach side of a
# `cc -ffast-math` comparison, selected by bench.sh --fast-math
[profile.reassoc]
optimize = true
debug = false
simd = "scalarize"
relax = ["float-reassoc"]

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
